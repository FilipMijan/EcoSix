        .section-content {

            margin-bottom: 15px;
            border-radius: 8px;

            transition: all 0.3s ease;
        }

        .bin-card:hover {

        .bin-card.expanded .expand-icon {

        }

        .bin-details {

            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;

        .stat-label {

        .stat-value {

            font-weight: 600;

        .progress-bar {

        .collected-items-title {

        .item-list {

        .item-name {

        .item-count {

            color: white;
            padding: 20px;
            font-size: 0.9em;

</head>
<body>
    <div class="container">
        <header>
            <h1><span class="emoji-header">🐦‍⬛</span>Kljun.me</h1>
            <p>Smart Trash Bin & Crow Collection System - Work Purpose Platform</p>
        </header>

        <div class="stats-overview">
            <div class="stat-box">
                <div class="emoji">🗑️</div>
                <div class="number" id="totalBins">0</div>

            </div>
            <div class="stat-box">
                <div class="emoji">🐦</div>
                <div class="number" id="totalCrows">0</div>
                <div class="label">Active Crows</div>
            </div>
            <div class="stat-box">
                <div class="emoji">♻️</div>
                <div class="number" id="totalItems">0</div>
                <div class="label">Items Collected</div>
            </div>
            <div class="stat-box">
                <div class="emoji">🌍</div>
                <div class="number" id="totalTrips">0</div>
                <div class="label">Total Trips</div>
            </div>
        </div>

        <div class="map-container">
            <div class="map-header">
                <span class="emoji">🗺️</span>
                Collection Map
            </div>
            <div class="map-toggle">
                <div>
                    <label style="margin-right: 10px; font-weight: 600;">View Mode:</label>
                </div>
                <div class="toggle-buttons">
                    <button class="toggle-btn active" onclick="setMapMode('trips')">🛤️ Crow Trips</button>
                    <button class="toggle-btn" onclick="setMapMode('items')">📍 Item Locations</button>
                    <button class="toggle-btn" onclick="setMapMode('bins')">🗑️ Bin Locations</button>
                </div>
            </div>
            <div id="map" class="scrollbar"></div>
        </div>

        <div class="main-content">
            <div class="section">
                <div class="section-header">
                    <span class="emoji">🗑️</span>
                    Smart Bins
                </div>
                <div class="filter-section">
                    <label style="font-weight: 600;">Filter:</label>
                    <button class="filter-btn active" onclick="filterBins('all')">All</button>
                    <button class="filter-btn" onclick="filterBins('active')">Active</button>
                    <button class="filter-btn" onclick="filterBins('low-battery')">Low Battery</button>
                </div>
                <div class="section-content scrollbar" id="binsContainer">
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="emoji">🐦</span>
                    Crows
                </div>
                <div class="filter-section">
                    <label style="font-weight: 600;">Filter:</label>
                    <button class="filter-btn active" onclick="filterCrows('all')">All</button>
                    <button class="filter-btn" onclick="filterCrows('active')">Active</button>
                </div>
                <div class="section-content scrollbar" id="crowsContainer">
                </div>
            </div>
        </div>

        <footer>
            <p>🐦 Kljun.me © 2025 - Smart Waste Collection System | Work Purpose Only</p>
        </footer>
    </div>

        function initMap() {
            map = L.map('map').setView([42.45, 19.0], 9);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
            
            markersGroup.addTo(map);
            renderMapTrips();
        }

        function renderMapTrips() {
            markersGroup.clearLayers();
            
            if (currentMapMode === 'trips') {
                database.crows.forEach(crow => {
                    crow.trips.forEach(trip => {
                        const latlng1 = [trip.startLocation.x, trip.startLocation.y];
                        const latlng2 = [trip.endLocation.x, trip.endLocation.y];
                        
                        L.polyline([latlng1, latlng2], {
                            color: '#667eea',
                            weight: 3,
                            opacity: 0.7,
                            dashArray: '5, 5'
                        }).addTo(markersGroup).bindPopup(`Trip: ${trip.id}<br>Crow: ${crow.id}<br>Items: ${trip.itemsCollected}<br>Distance: ${trip.distance}m`);
                        
                        L.circleMarker(latlng1, {
                            radius: 6,
                            fillColor: '#ffc107',
                            color: '#ff6b00',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(markersGroup).bindPopup(`Start: ${trip.id}`);
                        
                        L.circleMarker(latlng2, {
                            radius: 6,
                            fillColor: '#28a745',
                            color: '#20c997',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(markersGroup).bindPopup(`End: ${trip.id}`);
                    });
                });
            } else if (currentMapMode === 'items') {
                database.paths.forEach(path => {
                    const latlng = [path.location.x, path.location.y];
                    L.marker(latlng, {
                        icon: L.icon({
                            iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23667eea"><circle cx="12" cy="12" r="10" fill="%23667eea"/></svg>',
                            iconSize: [24, 24]
                        })
                    }).addTo(markersGroup).bindPopup(`Item: ${path.itemName}<br>Crow: ${path.crowId}<br>Trip: ${path.tripId}`);
                });
            } else if (currentMapMode === 'bins') {
                database.bins.forEach(bin => {
                    const latlng = [bin.location.x, bin.location.y];
                    L.marker(latlng, {
                        icon: L.icon({
                            iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23764ba2"><path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z" fill="%23764ba2"/></svg>',
                            iconSize: [32, 32]
                        })
                    }).addTo(markersGroup).bindPopup(`Bin: ${bin.id}<br>Battery: ${bin.battery}%<br>Capacity: ${bin.capacity}%<br>Connected Crows: ${bin.connectedCrows.length}`);
                });
            }
        }

        function setMapMode(mode) {
            currentMapMode = mode;
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMapTrips();
        }

        function filterBins(filter) {
            currentBinFilter = filter;
            const section = event.target.closest('.filter-section');
            section.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderBins();
        }

        function filterCrows(filter) {
            currentCrowFilter = filter;
            const section = event.target.closest('.filter-section');
            section.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCrows();
        }

        function renderBins() {
            const binsContainer = document.getElementById('binsContainer');
            binsContainer.innerHTML = '';

            let filteredBins = database.bins;
            if (currentBinFilter === 'active') {
                filteredBins = database.bins.filter(bin => bin.battery > 0);
            } else if (currentBinFilter === 'low-battery') {
                filteredBins = database.bins.filter(bin => bin.battery < 50);
            }

            filteredBins.forEach(bin => {
                const binCard = document.createElement('div');
                binCard.className = 'bin-card';
                binCard.innerHTML = `
                    <div class="bin-header" onclick="toggleBinCard(this)">
                        <span class="bin-id">🗑️ ${bin.id}</span>
                        <span class="expand-icon">▼</span>
                    </div>
                    <div class="bin-details">
                        <div class="stat-row">
                            <span class="stat-label">🔋 Battery Status:</span>
                            <span class="stat-value">${bin.battery}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${bin.battery}%; background: ${bin.battery < 30 ? '#dc3545' : bin.battery < 60 ? '#ffc107' : '#28a745'};"></div>
                        </div>
                        
                        <div class="stat-row" style="margin-top: 15px;">
                            <span class="stat-label">📦 Capacity Filled:</span>
                            <span class="stat-value">${bin.capacity}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${bin.capacity}%;"></div>
                        </div>

                        <div class="stat-row" style="margin-top: 15px;">
                            <span class="stat-label">📍 Location:</span>
                            <span class="stat-value">x: ${bin.location.x.toFixed(4)}, y: ${bin.location.y.toFixed(4)}</span>
                        </div>

                        <div class="collected-items">
                            <div class="collected-items-title">📊 Collected Items (by count):</div>
                            <div class="item-list">
                                ${bin.collectedItems.map(item => `
                                    <div class="item-entry">
                                        <span class="item-name">${item.name}</span>
                                        <span class="item-count">${item.count}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div style="margin-top: 15px;">
                            <div class="collected-items-title">🐦 Connected Crows:</div>
                            <div class="crow-list">
                                ${bin.connectedCrows.map(crow => `<span class="crow-badge">${crow}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                binsContainer.appendChild(binCard);
            });
        }

        function renderCrows() {
            const crowsContainer = document.getElementById('crowsContainer');
            crowsContainer.innerHTML = '';

            let filteredCrows = database.crows;
            if (currentCrowFilter === 'active') {
                filteredCrows = database.crows.filter(crow => crow.status === 'active');
            }

            filteredCrows.forEach(crow => {
                const crowCard = document.createElement('div');
                crowCard.className = 'crow-card';
                crowCard.innerHTML = `
                    <div class="crow-header" onclick="toggleCrowCard(this)">
                        <span>🐦 ${crow.id}</span>
                        <span class="expand-icon">▼</span>
                    </div>
                    <div class="crow-details">
                        <div class="stat-row">
                            <span class="stat-label">📍 Assigned Bin:</span>
                            <span class="stat-value">${crow.binId}</span>
                        </div>

                        <div class="stat-row">
                            <span class="stat-label">🟢 Status:</span>
                            <span class="stat-value" style="color: ${crow.status === 'active' ? '#28a745' : '#dc3545'};">${crow.status.toUpperCase()}</span>
                        </div>

                        <div class="stat-row">
                            <span class="stat-label">🛤️ Total Trips:</span>
                            <span class="stat-value">${crow.trips.length}</span>
                        </div>

                        <div class="stat-row">
                            <span class="stat-label">📦 Items Collected:</span>
                            <span class="stat-value">${crow.trips.reduce((sum, trip) => sum + trip.itemsCollected, 0)}</span>
                        </div>

                        <div class="collected-items" style="margin-top: 15px;">
                            <div class="collected-items-title">🗺️ Recent Trips:</div>
                            ${crow.trips.map(trip => `
                                <div class="trip-item">
                                    <strong>${trip.id}</strong><br>
                                    Items: ${trip.itemsCollected} | <span class="trip-distance">Distance: ${trip.distance}m</span><br>
                                    From: (${trip.startLocation.x.toFixed(4)}, ${trip.startLocation.y.toFixed(4)})<br>
                                    To: (${trip.endLocation.x.toFixed(4)}, ${trip.endLocation.y.toFixed(4)})
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                crowsContainer.appendChild(crowCard);
            });
        }

        function toggleBinCard(header) {
            const card = header.closest('.bin-card');
            card.classList.toggle('expanded');
        }

        function toggleCrowCard(header) {
            const card = header.closest('.crow-card');
            card.classList.toggle('expanded');
        }

        function updateStats() {
            const totalItems = database.bins.reduce((sum, bin) => sum + bin.collectedItems.reduce((s, item) => s + item.count, 0), 0);
            const totalTrips = database.crows.reduce((sum, crow) => sum + crow.trips.length, 0);
            
            document.getElementById('totalBins').textContent = database.bins.length;
            document.getElementById('totalCrows').textContent = database.crows.length;
            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('totalTrips').textContent = totalTrips;
        }

        window.addEventListener('DOMContentLoaded', function() {
            initMap();
            renderBins();
            renderCrows();
            updateStats();
        });
    </script>
</body>
</html>
